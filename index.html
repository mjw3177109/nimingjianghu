<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逆命江湖 · 青石镇篇</title><link rel="stylesheet" href="style.css"></head><body>
<div class="shell"><header><div class="brand"><span class="seal">逆</span><div><strong>逆命江湖</strong><small>像素武侠 RPG · 第一章 · 青石镇篇</small></div></div><div class="head-actions"><span class="pill">Playable Demo · v0.1</span><button id="restart">重新开始</button></div></header>
<section class="stage"><div class="game-frame"><canvas id="game" width="640" height="360" aria-label="逆命江湖游戏画面"></canvas><div id="location" class="location"></div><div id="hint" class="hint">点击地面移动 · 点击人物交谈 · 点击出口切换地图</div></div>
<aside class="sidebar"><div class="hero"><div class="portrait">砚</div><div><small>穿越者 · 剑客</small><h2>沈砚 <em>Lv.<span id="level">1</span></em></h2></div></div><div class="meter"><label>气血 <span id="hpText">100 / 100</span></label><div class="bar"><i id="hpBar" class="red"></i></div></div><div class="meter"><label>内力 <span id="mpText">50 / 50</span></label><div class="bar"><i id="mpBar" class="blue"></i></div></div><div class="statline"><div>江湖天数 <strong id="day">第 1 天</strong></div><div>逆命值 <strong id="destiny">0</strong></div></div><div class="divider"></div><p class="subheading">当前任务</p><div class="quest" id="quest">正在进入江湖……</div><p class="subheading">江湖手记</p><div class="journal" id="journal">这个世界似乎与记忆中的江湖相似。</div><div class="controls"><button id="inventory">背包 I</button><button id="quests">任务 Q</button><button id="help">玩法说明</button></div><div class="sidebar-foot">刀光照旧事，孤身破命局。</div></aside></section>
<footer><div><span class="dot"></span><span id="status">游戏加载中…</span></div><div>原创场景与角色像素绘制 · 数据驱动任务 · 支持浏览器试玩</div></footer></div>
<div id="dialogue" class="modal hidden"><div class="dialogue-box"><div id="speaker" class="speaker">旁白</div><div id="dialogueText" class="dialogue-text"></div><div class="dialogue-actions"><span>点击继续 / Enter / Space</span><button id="nextDialogue">继续 →</button></div></div></div>
<div id="battle" class="modal hidden"><div class="combat-box"><h2>⚔  江湖交锋 <small id="battleName">山贼</small></h2><div class="combat-hp"><div>沈砚 <span id="battlePlayerHp">100</span></div><div>对手 <span id="battleEnemyHp">54</span></div></div><div class="battle-log" id="battleLog">战斗开始。</div><div class="battle-buttons"><button data-action="attack">基础剑法 · 攻击</button><button data-action="skill">破风一剑 · 8内力</button><button data-action="heal">疗伤药 × <span id="potions">2</span></button><button data-action="defend">凝神防御</button></div></div></div>
<div id="panel" class="modal hidden"><div class="panel-box"><h2 id="panelTitle">背包</h2><div id="panelContent"></div><button id="closePanel">关闭</button></div></div>
<script src="world-data.js"></script><script src="game.js"></script></body></html>
