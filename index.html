<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#131a25"><title>逆命江湖 · Q版国风试玩</title><link rel="stylesheet" href="style.css"></head><body>
<main id="homeScreen" class="home-screen" aria-label="逆命江湖首页">
  <div class="artboard">
    <div class="hero-panels">
      <section class="art-panel left-menu" style="--image:url('assets/home/menu_panel.webp')" aria-label="主菜单">
        <button id="startButton" style="--y:34.8%" class="menu-hotspot" aria-label="开始游戏"><span>开始游戏</span></button>
        <button id="continueButton" style="--y:46.0%" class="menu-hotspot" aria-label="继续游戏"><span>继续游戏</span></button>
        <button data-page="settings" style="--y:57.0%" class="menu-hotspot" aria-label="游戏设置"><span>游戏设置</span></button>
        <button data-page="codex" style="--y:68.0%" class="menu-hotspot" aria-label="角色图鉴"><span>角色图鉴</span></button>
        <button data-page="recap" style="--y:79.5%" class="menu-hotspot" aria-label="剧情回顾"><span>剧情回顾</span></button>
        <button data-page="about" style="--y:90.0%" class="menu-hotspot" aria-label="关于本作"><span>关于本作</span></button>
      </section>
      <section class="art-panel center-hero" style="--image:url('assets/home/hero_panel.webp')" aria-label="沈砚，逆天改命，再入江湖"></section>
      <section class="art-panel right-cards" style="--image:url('assets/home/cards_panel.webp')" aria-label="江湖人物">
        <button data-character="CHAR001" class="character-hotspot" style="--y:0%" aria-label="查看沈砚"></button>
        <button data-character="NPC005" class="character-hotspot" style="--y:25%" aria-label="查看苏晚晴"></button>
        <button data-character="NPC001" class="character-hotspot" style="--y:50%" aria-label="查看韩掌柜"></button>
        <button data-character="BOSS001" class="character-hotspot" style="--y:75%" aria-label="查看廖"></button>
      </section>
    </div>
    <div class="preview-panels">
      <button class="preview-panel" data-preview="town"><img src="assets/home/preview_town.webp" alt="青石镇玩法预览"></button>
      <button class="preview-panel" data-preview="road"><img src="assets/home/preview_battle.webp" alt="城外山路战斗预览"></button>
      <button class="preview-panel" data-preview="cave"><img src="assets/home/preview_cave.webp" alt="废弃山洞探索预览"></button>
    </div>
    <img class="feature-strip" src="assets/home/feature_strip.webp" alt="江湖探索、剧情、养成、战斗与国风Q版">
  </div>
  <div class="home-caption" id="saveCaption">欢迎来到江湖 · 点击开始游戏</div>
</main>
<section id="codexScreen" class="codex-screen" hidden aria-label="群侠图鉴">
  <div class="codex-book"><img src="assets/home/characters_gallery_ref.webp" alt="逆命江湖群侠人物绘卷"><div class="codex-overlay">
    <h1>群侠绘卷</h1><div id="codexInfo">点击人物查看介绍</div>
    <div class="codex-hotspots">
      <button data-character="CHAR001" aria-label="沈砚"></button><button data-character="BOSS001" aria-label="廖"></button><button data-character="NPC001" aria-label="韩掌柜"></button><button data-character="NPC002" aria-label="顾老"></button><button data-character="NPC003" aria-label="顾青岚"></button><button data-character="NPC005" aria-label="苏晚晴"></button>
    </div>
  </div></div><button class="gold-btn" id="codexBack">返回首页</button>
</section>
<section id="gameScreen" class="play-screen" hidden aria-label="游戏中">
  <div class="play-area">
    <div class="play-frame"><canvas id="game" width="640" height="360" aria-label="逆命江湖地图，可点击地面移动，点击人物交谈"></canvas>
      <div class="painted-hud">
        <div class="status-box"><img src="assets/portraits/CHAR001_avatar.webp" alt="沈砚"><div class="status-meters"><b>沈砚 <small>Lv.<span id="level">1</span></small></b><div class="gauge hp-gauge"><i id="hpBar"></i></div><div class="gauge mp-gauge"><i id="mpBar"></i></div><span id="hpText">100 / 100</span> <span id="mpText">50 / 50</span></div></div>
        <div class="mission-box"><b>主线 · 江湖记事</b><p id="quest">初入青石镇</p><small id="journal">眼前的江湖似曾相识。</small></div>
        <div class="map-status"><strong id="location">青石镇</strong><span id="day">第 1 天</span> · 逆命 <em id="destiny">0</em><div class="mini-map">✧ <span>江湖纪事</span></div></div>
        <div id="hint" class="game-hint">点击地面移动 · 点击NPC交谈</div>
      </div>
    </div>
    <div class="game-toolbar"><span class="location-mark" id="status">江湖未远，命运初启。</span><button id="inventory">⚑ <b>角色 / 包裹</b></button><button id="quests">▣ <b>任务手记</b></button><button id="help">❖ <b>操作说明</b></button><button id="restart">↩ <b>返回首页</b></button></div>
  </div>
</section>
<div id="dialogue" class="modal hidden"><div class="dialogue-box"><img id="dialoguePortrait" class="dialogue-avatar" src="assets/portraits/CHAR001_avatar.webp" alt="对话人物"><div class="dialogue-details"><div class="speaker" id="speaker">旁白</div><div id="dialogueText" class="dialogue-text"></div><div class="dialogue-actions"><small>Enter / 点击继续</small><button id="nextDialogue">继续 ▸</button></div></div></div></div>
<div id="battle" class="modal hidden"><div class="combat-box"><h2>⚔ 江湖交锋 <small id="battleName">山贼</small></h2><div class="combat-actors"><img src="assets/sprites/player.png" alt="沈砚"><span>⚔</span><img src="assets/sprites/bandit.png" alt="山贼"></div><div class="combat-hp"><div>沈砚 <span id="battlePlayerHp">100</span></div><div>山贼 <span id="battleEnemyHp">54</span></div></div><div class="battle-log" id="battleLog">战斗开始</div><div class="battle-buttons"><button data-action="attack"><b>⚔</b> 普通攻击</button><button data-action="skill"><b>✦</b> 破风一剑</button><button data-action="heal"><b>✚</b> 疗伤 <span id="potions">2</span></button><button data-action="defend"><b>⛨</b> 防御</button></div></div></div>
<div id="panel" class="modal hidden"><div class="panel-box"><h2 id="panelTitle">江湖手记</h2><div id="panelContent"></div><button id="closePanel">关闭</button></div></div>
<div id="menuPanel" class="modal hidden"><div class="panel-box"><h2 id="menuPanelTitle">江湖手记</h2><div id="menuPanelContent"></div><button id="menuPanelClose">返回</button></div></div>
<script src="world-data.js"></script><script src="game.js"></script><script src="app.js"></script></body></html>
