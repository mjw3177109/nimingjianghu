name: Web Demo Smoke Test
on:
  push:
    branches: [main, feat/playable-demo-v0.1]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d682002 # v4.4.0
        with:
          node-version: '22'
      - run: node --check game.js
      - run: node --check app.js
      - run: node --check world-data.js
      - run: node tests/final_smoke.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
